<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the page draw under the notch/home-indicator
         safe areas instead of the browser reserving that space itself — this
         is also what makes `env(safe-area-inset-*)` (and this app's own
         react-native-safe-area-context, which reads the same values) report
         anything other than 0 on iOS Safari/PWA. Without it, the edge-to-edge
         background and the safe-area-aware sheet padding below are both
         inert, even though the code for both already exists. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Mutated at runtime by src/theme/themeColor.ts (`updateThemeColor`) to
         match a bottom sheet's dark backdrop while one is open, so the
         system status bar/task-switcher strip doesn't sit as a mismatched
         default-colored band above the overlay. #ffffff matches this app's
         own default background (`swapColors.hero` in
         src/features/swap/theme.ts) — keep the two in sync if that ever
         changes. -->
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <!-- iOS PWA (Add to Home Screen) chrome: runs without Safari's own
         address bar, and lets the status bar itself blend into the page
         (translucent) instead of forcing a fixed system color band. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Morapay" />
    <title>%WEB_TITLE%</title>

    <!-- Real site metadata — same copy/brand color the old frontend/apps/app
         (the Next.js checkout this app replaced) used in its own layout.tsx,
         so search engines/link previews describe what this app actually does
         instead of falling back to Expo's own defaults (or nothing at all). -->
    <meta name="description" content="Send, receive, buy crypto, and receive fiat across the world. Mobile money, cards, and stablecoins — all in one app." />
    <link rel="canonical" href="https://app.morapay.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morapay" />
    <meta property="og:url" content="https://app.morapay.io/" />
    <meta property="og:title" content="Morapay | Send, receive & exchange across the world" />
    <meta property="og:description" content="Send, receive, buy crypto, and receive fiat across the world. Mobile money, cards, and stablecoins — all in one app." />
    <meta property="og:image" content="https://app.morapay.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:logo" content="https://app.morapay.io/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@morapay" />
    <meta name="twitter:creator" content="@morapay" />
    <meta name="twitter:title" content="Morapay | Send, receive & exchange across the world" />
    <meta name="twitter:description" content="Send, receive, buy crypto, and receive fiat across the world. Mobile money, cards, and stablecoins — all in one app." />
    <meta name="twitter:image" content="https://app.morapay.io/og-image.png" />

    <!-- Real Morapay "m" mark (see assets/icon.png's own source) — Expo's own
         export pipeline generates /favicon.ico from that same file; these
         cover the sizes/formats it doesn't (apple-touch-icon, PWA manifest
         icons). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height. The explicit background
         (matching theme-color's own default above, and swapColors.hero)
         is what actually shows through the notch/home-indicator safe-area
         insets — that region is part of the page's own layout viewport
         with viewport-fit=cover set, not native chrome, so it paints
         whatever html/body's background is. src/theme/themeColor.ts
         updates this same background at runtime to match whatever's open
         (a dark bottom sheet, the receipt screen, ...); this is just the
         default before any of that JS has run. */
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
